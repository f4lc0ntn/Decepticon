# Local override (auto-merged by `docker compose`).
#
# Reconciles the stock OSS compose with the *current* GHCR images, which are
# newer than the checked-in compose/docs. The sandbox transport changed to
# HTTP-only (decepticon.backends.factory -> HTTPSandbox at http://sandbox:9999,
# bearer-auth via the sandbox daemon). Stock compose never (a) joins langgraph
# to sandbox-net, (b) sets SAAS_SANDBOX_URL, or (c) aligns the daemon/client
# bearer token — so out of the box every agent tool call 401s or fails DNS.
# The production launcher injects these; we replicate it here.
#
# Token: the daemon (sandbox) reads DECEPTICON_SANDBOX_TOKEN; the client
# (langgraph) sends SAAS_SANDBOX_TOKEN as the bearer. They must share a value.
# We set both to a known fixed string (isolated lab; value is not sensitive).
services:
  sandbox:
    environment:
      - DECEPTICON_SANDBOX_TOKEN=glm-ms3-sandbox-3f9a2c7e1b
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Sandbox logging proxy ────────────────────────────────────────────────────
  # Sits between langgraph and sandbox:9999. Logs every execute/execute_tmux
  # request body (command) and response body (stdout/stderr/exit_code) to
  # C:\decepticon\logs\sandbox-proxy.ndjson on the host.
  # langgraph points at this proxy instead of sandbox directly.
  sandbox-proxy:
    build:
      context: ./containers/sandbox-proxy
    container_name: decepticon-sandbox-proxy
    networks:
      - sandbox-net
    environment:
      - UPSTREAM_URL=http://sandbox:9999
      - LOG_PATH=/logs/sandbox-proxy.ndjson
      - LISTEN_PORT=9998
    volumes:
      - C:/decepticon/logs:/logs
    depends_on:
      - sandbox
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langgraph:
    networks:
      - decepticon-net
      - sandbox-net
    environment:
      # Route through proxy so all execute() bodies are logged
      - SAAS_SANDBOX_URL=http://sandbox-proxy:9998
      - SAAS_SANDBOX_TOKEN=glm-ms3-sandbox-3f9a2c7e1b
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  litellm:
    environment:
      # JSON_LOGS=true + LITELLM_LOG=DEBUG: one structured log line per LLM call.
      # store_model_in_db=true in litellm.yaml persists full messages+response to
      # the LiteLLM_SpendLogs postgres table (restart litellm to apply).
      - LITELLM_LOG=DEBUG
      - JSON_LOGS=true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
